name: ci
on: [push, pull_request]
jobs:
  qrkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: qrkit tests
        run: cd plugins/quant-research/qrkit && uv run --frozen pytest -q
      - name: README quickstart runs as written
        run: bash scripts/check_readme.sh
